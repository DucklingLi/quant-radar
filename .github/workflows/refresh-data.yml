name: daily-scan

# ============================================================
# 合并站（quant-radar）每日自动更新 + 部署 GitHub Pages
#   · 每交易日 16:35/16:50（北京时间）双槽自动运行（GitHub cron 不保证准点，双槽兜底）
#   · 也可在仓库 Actions 页面手动触发（Run workflow）
# ============================================================
on:
  workflow_dispatch:
  schedule:
    - cron: "35 8 * * 1-5"     # 北京 16:35
    - cron: "50 8 * * 1-5"     # 北京 16:50（若前一槽未触发）

permissions:
  contents: write

jobs:
  scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Step 0: check if today's post-close scan exists"
        id: fresh
        run: |
          if [ -f radar/data.json ]; then
            G=$(python -c "import json;print((json.load(open('radar/data.json',encoding='utf-8')).get('generatedAt') or '')[:16])" 2>/dev/null || echo "")
            TODAY=$(date -u +%Y-%m-%d)
            if [ -n "$G" ] && [ "$G" \> "$TODAY 08:00" ]; then
              echo "today post-close scan exists: $G"
              echo "fresh=yes" >> "$GITHUB_OUTPUT"
            else
              echo "stale: $G (need rescan)"
              echo "fresh=no" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "fresh=no" >> "$GITHUB_OUTPUT"
          fi

      - name: "Step 1/5: industry data update"
        if: steps.fresh.outputs.fresh != 'yes'
        run: cd industry && python scripts/update.py

      - name: "Step 2/5: radar full-market scan"
        if: steps.fresh.outputs.fresh != 'yes'
        run: cd radar && python scripts/scan.py

      - name: "Step 3/5: prospect evaluate"
        run: cd radar && python scripts/prospect_track.py

      - name: "Step 4/5: commit data if changed"
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add industry/data.json industry/fallback-data.js \
                  radar/data.json radar/fallback-data.js radar/prospect.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: scan $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: "Step 5/5: stage publish files"
        run: |
          rm -rf deploy
          mkdir -p deploy/industry deploy/radar
          cp index.html portfolio.html deploy/
          cp industry/index.html industry/data.json industry/fallback-data.js deploy/industry/
          cp radar/index.html radar/live.html radar/data.json radar/fallback-data.js \
             radar/MODEL.md radar/MODEL.html radar/prospect.json radar/industry_map.json deploy/radar/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          enable_jekyll: false
          user_name: data-bot
          user_email: actions@github.com
